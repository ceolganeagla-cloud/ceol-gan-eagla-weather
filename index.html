<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Ceol Gan Eagla — Tuner</title>
<meta name="theme-color" content="#08260f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#08260f; --panel:#0d3117; --card:#0a2a14; --line:#174f24;
  --ink:#f5f7f4; --muted:#c8d3c6; --gold:#d4af37; --warn:#ef4444;
  --high:#ffb020; --good:#23d36b; --inkdim:#dfe6de;
}
*{box-sizing:border-box}
html,body{
  min-height:100svh;
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
}
body{display:flex;flex-direction:column}

/* Header */
header{display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem .3rem;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:#06220e;display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.title{font-weight:800;letter-spacing:.2px;font-size:1.05rem}
.mic{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-weight:700}
.lamp{width:10px;height:10px;border-radius:50%;background:#7a0000;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.lamp.ask{background:#c98a00}
.lamp.on{background:#23d36b}

/* Flag stripe */
.flagbar{height:4px;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;box-shadow:0 1px 0 rgba(0,0,0,.3) inset}
.flagbar span:nth-child(1){background:#169b62}
.flagbar span:nth-child(2){background:#ffffff}
.flagbar span:nth-child(3){background:#ff883e}

/* Layout */
main{
  flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;
  padding:8px 10px max(10px, env(safe-area-inset-bottom));
  max-width:900px;margin:0 auto; /* centers on large screens */
}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,input[type="number"]{
  background:#0a2311;border:1px solid var(--line);color:var(--ink);
  padding:.55rem .7rem;border-radius:12px;font-size:1.02rem
}
button.primary{background:var(--gold);border:none;color:#2a260e;font-weight:800}
label{color:var(--muted);font-size:.95rem}
.chip{padding:.25rem .55rem;border:1px solid var(--line);border-radius:999px;background:#0a2311;color:#dfe6de;font-size:.9rem}

/* Tuner card (responsive sizing) */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.02)),var(--card);
  border:1px solid rgba(255,255,255,.06);border-radius:16px;
  padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.22)
}
.row{display:flex;flex-direction:column;gap:8px}

/* Visual elements use clamp to fit any screen */
#bars{
  width:100%;
  height:clamp(110px, 22vh, 160px);
  background:#081e0f;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)
}
#gauge{
  width:100%;
  height:clamp(70px, 14vh, 90px);
  display:block;background:#081e0f;border-radius:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)
}
#stringLine{
  width:100%;
  height:clamp(54px, 11vh, 64px);
  background:#081e0f;border-radius:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)
}

.info{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.badge{padding:.25rem .55rem;border:1px solid var(--line);border-radius:999px;background:#0a2311;color:var(--ink)}
.status{font-size:1.5rem;font-weight:900;margin-top:2px;text-align:center}
.status.low{color:var(--warn)} .status.high{color:var(--high)} .status.good{color:var(--good)}
.small{font-size:.9rem;color:var(--inkdim);text-align:center}

/* Metronome */
.beats{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin-top:6px}
.beat{width:20px;height:20px;border-radius:50%;background:#284d30;border:2px solid #325c3a;transition:transform .06s ease, background .06s ease, border-color .06s ease}
.beat.active{background:var(--gold);border-color:#ffe28a;transform:translateY(-10px)}
.beat.group{box-shadow:0 0 0 2px rgba(212,175,55,.35) inset}

footer{border-top:1px solid var(--line);padding:8px 0;text-align:center;color:#aaa;font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="icons/logo.png" alt="Ceol Gan Eagla logo"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'CGE',style:'font-weight:900;color:#d4af37;'}))">
  </div>
  <div class="title">Ceol Gan Eagla — Tuner</div>
  <div class="mic"><div id="micLamp" class="lamp"></div><span id="micText">Mic: Off</span></div>
</header>
<div class="flagbar"><span></span><span></span><span></span></div>

<main>
  <!-- Controls -->
  <section class="panel">
    <div class="controls">
      <button id="toggleBtn" class="primary" data-state="off">Start</button>
      <span class="chip">Tuning</span>
      <select id="tuning">
        <optgroup label="Mandolin / Fiddle">
          <option data-inst="mandolin" value="G4,D4,A4,E5">Fiddle (G D A E)</option>
          <option data-inst="mandolin" value="G4,D4,A3,E3" selected>Mandolin / Tenor Banjo (G D A E)</option>
        </optgroup>
        <optgroup label="Tenor Banjo">
          <option data-inst="tenorbanjo" value="C4,G3,D3,A2">Standard (C G D A)</option>
          <option data-inst="tenorbanjo" value="G4,D4,A3,E3">Irish (G D A E)</option>
        </optgroup>
        <optgroup label="Guitar">
          <option data-inst="guitar" value="E4,B3,G3,D3,A2,E2">Standard (E A D G B E)</option>
          <option data-inst="guitar" value="D4,A3,G3,D3,A2,D2">DADGAD (D A D G A D)</option>
        </optgroup>
        <optgroup label="Bouzouki">
          <option data-inst="bouzouki" value="D4,A3,G3,D3">GDAD (G D A D)</option>
        </optgroup>
        <optgroup label="Other">
          <option data-inst="chromatic" value="">Chromatic (no target)</option>
        </optgroup>
      </select>
      <label><input type="checkbox" id="vibrateToggle"/> Vibrate on “In Tune”</label>
    </div>
  </section>

  <!-- TUNER -->
  <section class="card">
    <div class="row">
      <canvas id="bars" aria-label="Audio visualizer"></canvas>
      <canvas id="gauge" aria-label="Tuning gauge"></canvas>

      <div class="info">
        <div id="noteBadge" class="badge">Note: —</div>
        <div id="stringBadge" class="badge">String: —</div>
      </div>

      <!-- active-string line with moving indicator -->
      <canvas id="stringLine" aria-label="String indicator"></canvas>

      <div id="status" class="status">Stopped</div>
      <div class="small" id="noteLabel">Target: Chromatic</div>
    </div>
  </section>

  <!-- Metronome -->
  <section class="panel">
    <div class="controls">
      <strong>Metronome</strong>
      <span class="chip">BPM</span><input type="number" id="bpm" value="100" min="30" max="300" style="width:84px;text-align:center">
      <span class="chip">Time</span>
      <select id="timesig">
        <option value="2/4">2/4</option><option value="3/4">3/4</option><option value="4/4" selected>4/4</option>
        <option value="6/8">6/8</option><option value="9/8">9/8</option><option value="12/8">12/8</option>
      </select>
      <button id="metroToggle" class="primary" data-state="off">Start</button>
    </div>
    <div id="beats" class="beats"></div>
  </section>
</main>

<footer>&copy; 2025 Gearóid MacUaid — Ceol Gan Eagla · <a href="privacy.html" style="color:var(--gold)">Privacy</a></footer>

<script>
/* ===== Globals ===== */
let audioCtx, analyser, mediaStream, raf, floatBuf;
let avgWindowFreq = null;                  // EMA of freq
const EMA_ALPHA = 0.25;                    // smoother = smaller
const UPDATE_HZ=12, ENERGY_GATE=0.012, STABILITY_CENTS=7;
let lastUpdate=0, stableCounter=0, lastShownCents=0;

const micLamp=document.getElementById('micLamp'), micText=document.getElementById('micText');
const toggleBtn=document.getElementById('toggleBtn');
const statusEl=document.getElementById('status'), noteLabel=document.getElementById('noteLabel');
const noteBadge=document.getElementById('noteBadge'), stringBadge=document.getElementById('stringBadge');

/* ===== Mic indicator ===== */
function setMic(s){
  micLamp.className='lamp'+(s==='ask'?' ask':s==='on'?' on':'');
  micText.textContent='Mic: '+(s==='on'?'On':s==='ask'?'Asking…':'Off');
}

/* ===== Visualizer ===== */
const bars=document.getElementById('bars'), viz=bars.getContext('2d');
function sizeBars(){bars.width=bars.clientWidth;bars.height=bars.clientHeight}
let vizPrev=new Array(24).fill(0);
function drawBars(){
  if(!analyser){return;}
  const len=analyser.frequencyBinCount, freq=new Uint8Array(len); analyser.getByteFrequencyData(freq);
  const inset=10, W=bars.width-inset*2, H=bars.height-inset*2, bands=24, step=Math.max(1,Math.floor(len/bands));
  const w=W/(bands*1.1), gap=w*0.1, hMax=H; viz.clearRect(0,0,bars.width,bars.height);
  for(let i=0;i<bands;i++){
    const v=freq[i*step]/255, s=vizPrev[i]*0.9+v*0.1; vizPrev[i]=s;  /* stronger smoothing */
    const h=s*hMax, x=inset+i*(w+gap)+gap/2, y=inset+(hMax-h);
    viz.fillStyle='#d4af37'; viz.fillRect(x,y,w,h);
  }
  raf=requestAnimationFrame(drawBars);
}

/* ===== Gauge ===== */
const gauge=document.getElementById('gauge'), gctx=gauge.getContext('2d');
function sizeGauge(){gauge.width=gauge.clientWidth;gauge.height=gauge.clientHeight;drawGauge(null)}
function drawGauge(cents){
  const w=gauge.width,h=gauge.height,inset=14, railY=h/2+6, railW=w-inset*2;
  gctx.clearRect(0,0,w,h);
  gctx.fillStyle='#0c331a'; gctx.fillRect(inset,railY-9,railW,18); gctx.strokeStyle='rgba(255,255,255,.15)'; gctx.strokeRect(inset,railY-9,railW,18);
  gctx.fillStyle='rgba(255,255,255,.25)'; gctx.textAlign='center'; gctx.font='12px system-ui';
  for(let c=-50;c<=50;c+=10){const x=inset+(c+50)/100*railW; gctx.fillRect(x,railY-12,2,24); if(c%20===0) gctx.fillText(c,x,railY-18);}
  const x=inset+((Math.max(-50,Math.min(50,cents??0))+50)/100)*railW, inTune=(cents!=null && Math.abs(cents)<STABILITY_CENTS);
  gctx.beginPath(); gctx.arc(x,railY,11,0,Math.PI*2); gctx.fillStyle=inTune?'#23d36b':(cents==null?'#3a4f42':(cents<0?'#ef4444':'#ffb020')); gctx.fill(); gctx.lineWidth=3; gctx.strokeStyle='rgba(0,0,0,.35)'; gctx.stroke();
}

/* ===== String line ===== */
const sLine=document.getElementById('stringLine'), sctx=sLine.getContext('2d');
function sizeString(){sLine.width=sLine.clientWidth; sLine.height=sLine.clientHeight; drawString(null,null)}
let stringLabels=[];
function drawString(active,cents){
  const w=sLine.width,h=sLine.height,inset=14,y=h/2;
  sctx.clearRect(0,0,w,h);
  sctx.strokeStyle='#0c331a'; sctx.lineWidth=9; sctx.lineCap='round';
  sctx.beginPath(); sctx.moveTo(inset,y); sctx.lineTo(w-inset,y); sctx.stroke();
  sctx.lineWidth=2; sctx.strokeStyle='rgba(255,255,255,.12)'; sctx.strokeRect(inset,y-14,w-inset*2,28);
  const n=stringLabels.length||4, seg=(w-inset*2)/(Math.max(1,n-1));
  sctx.font='14px system-ui'; sctx.textAlign='center'; sctx.textBaseline='bottom';
  for(let i=0;i<n;i++){const x=inset+i*seg; sctx.fillStyle=(stringLabels[i]===active)?'#d4af37':'#c8d3c6'; sctx.fillText(stringLabels[i]||'',x,y-16);}
  if(active){
    const i=stringLabels.indexOf(active), base=inset+(i<0?0:i*seg), dx=(Math.max(-50,Math.min(50,cents??0))/50)*(seg*0.45);
    const inTune=cents!=null && Math.abs(cents)<STABILITY_CENTS;
    sctx.beginPath(); sctx.arc(base+dx,y,11,0,Math.PI*2); sctx.fillStyle=inTune?'#23d36b':(cents<0?'#ef4444':'#ffb020'); sctx.fill(); sctx.lineWidth=3; sctx.strokeStyle='rgba(0,0,0,.35)'; sctx.stroke();
  }
}

/* ===== Pitch detection helpers ===== */
const A4=440, NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freqToNote(f){const n=Math.round(12*Math.log2(f/A4))+69;return {name:NAMES[(n%12+12)%12],midi:n,oct:Math.floor(n/12)-1};}
function centsOff(f,m){const nf=A4*Math.pow(2,(m-69)/12);return 1200*Math.log2(f/nf);}

/* Autocorrelation with lag bounds (prevents jumping) */
function autoCorrelate(buf, sr){
  const SIZE=buf.length; let rms=0;
  for(let i=0;i<SIZE;i++){const v=buf[i]; rms+=v*v;}
  rms=Math.sqrt(rms/SIZE);
  if(rms<ENERGY_GATE) return {freq:-1};

  // centre clip (reduces noise)
  const CLIP=0.12; for(let i=0;i<SIZE;i++){ buf[i]=(Math.abs(buf[i])<CLIP)?0:buf[i]; }

  // search only within 70..1500Hz
  const maxF=1500, minF=70;
  let maxLag=Math.floor(sr/minF), minLag=Math.floor(sr/maxF);
  if(maxLag>=SIZE) maxLag=SIZE-1;
  if(minLag<2) minLag=2;

  // autocorrelation
  const c=new Float32Array(maxLag+1);
  for(let lag=minLag; lag<=maxLag; lag++){
    let s=0; for(let i=0;i<SIZE-lag;i++){ s += buf[i]*buf[i+lag]; }
    c[lag]=s;
  }
  // pick peak
  let bestLag=-1, best=0;
  for(let lag=minLag; lag<=maxLag; lag++){
    if(c[lag]>best){ best=c[lag]; bestLag=lag; }
  }
  if(bestLag<0) return {freq:-1};

  // parabolic interpolation
  let T0=bestLag;
  if(T0>minLag && T0<maxLag){
    const x1=c[T0-1], x2=c[T0], x3=c[T0+1];
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2; if(a) T0=T0 - b/(2*a);
  }
  return {freq: sr/T0};
}

/* Choose nearest octave of each string */
let targetSet=null; // array of {name,midi}
function closestTarget(freq){
  if (!targetSet || !freq) return null;
  const midiDetected = Math.round(12*Math.log2(freq/440))+69;
  let best=null, bestAbs=1e9;
  for(const t of targetSet){
    const k = Math.round((midiDetected - t.midi) / 12); // octave shift
    const midiNear = t.midi + 12*k;
    const cents = Math.abs(centsOff(freq, midiNear));
    if(cents<bestAbs){ bestAbs=cents; best={name:t.name, midi:midiNear}; }
  }
  return best;
}

/* UI status helper */
function setStatus(text, cls){ statusEl.className='status '+(cls||''); statusEl.textContent=text; }

/* ===== Update loop with stability lock ===== */
function updatePitch(){
  if (!analyser) return;

  const size=2048; if(!floatBuf||floatBuf.length!==size) floatBuf=new Float32Array(size);
  analyser.getFloatTimeDomainData(floatBuf);
  const {freq} = autoCorrelate(floatBuf, audioCtx.sampleRate);

  const now=performance.now(); if(now-lastUpdate<(1000/UPDATE_HZ)){ raf=requestAnimationFrame(updatePitch); return; }
  lastUpdate=now;

  if(freq===-1){
    setStatus('Listening…',''); drawGauge(null); drawString(null,null);
    noteBadge.textContent='Note: —'; stringBadge.textContent='String: —';
    avgWindowFreq=null; stableCounter=0;
    raf=requestAnimationFrame(updatePitch); return;
  }

  // EMA smoothing of frequency
  avgWindowFreq = (avgWindowFreq==null) ? freq : (avgWindowFreq*(1-EMA_ALPHA) + freq*EMA_ALPHA);
  const f = avgWindowFreq;

  const n=freqToNote(f); noteBadge.textContent=`Note: ${n.name}${n.oct}`;

  if(!targetSet){
    setStatus(`Play a note — ${n.name}`, '');
    drawGauge(0); drawString(null,null); stringBadge.textContent='String: —';
  }else{
    const tgt=closestTarget(f)||n;
    let cents=centsOff(f, tgt.midi);

    // stickiness to avoid jitter: only allow big jumps if difference is large
    if (Math.abs(cents - lastShownCents) < 2) cents = (cents*0.4 + lastShownCents*0.6);
    lastShownCents = cents;

    const abs=Math.abs(cents);
    drawGauge(Math.max(-50,Math.min(50,cents)));
    drawString(tgt.name, cents);
    stringBadge.textContent=`String: ${tgt.name}`;

    if(abs < STABILITY_CENTS){
      stableCounter = Math.min(stableCounter+1, 6);
    } else {
      stableCounter = Math.max(stableCounter-1, 0);
    }
    if(stableCounter >= 3){
      setStatus('Perfect Pitch','good');
      if(document.getElementById('vibrateToggle').checked && navigator.vibrate) navigator.vibrate(20);
    }else if(cents < 0){
      setStatus('Too Low','low');
    }else{
      setStatus('Too High','high');
    }
  }

  raf=requestAnimationFrame(updatePitch);
}

/* ===== Robust Start/Stop & lifecycle ===== */
async function startTuner(){
  if (toggleBtn.dataset.state === 'on') return;
  try{
    setMic('ask');
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    // kill any old stream
    if (mediaStream) mediaStream.getTracks().forEach(t=>t.stop());

    // ask for audio
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio:{
        channelCount:1,
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });

    const src=audioCtx.createMediaStreamSource(mediaStream);

    // Filter chain to stabilise pitch (HPF -> LPF -> Analyser)
    const hpf = audioCtx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=60; hpf.Q.value=0.707;
    const lpf = audioCtx.createBiquadFilter(); lpf.type='lowpass';  lpf.frequency.value=1800; lpf.Q.value=0.707;

    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    analyser.smoothingTimeConstant = 0.85; // extra smoothing for bars

    src.connect(hpf).connect(lpf).connect(analyser);

    setMic('on');
    toggleBtn.textContent='Stop'; toggleBtn.dataset.state='on';
    drawBars(); updatePitch();
  }catch(e){
    let msg='Microphone blocked or unavailable.';
    if (e.name==='NotAllowedError') msg='Microphone permission was denied.';
    if (e.name==='NotFoundError') msg='No microphone found on this device.';
    if (e.name==='NotReadableError') msg='Mic is in use by another app.';
    setStatus(msg+' Check site permissions.','low');
    console.error(e);
    setMic('off'); toggleBtn.textContent='Start'; toggleBtn.dataset.state='off';
  }
}
function stopTuner(){
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  if(analyser){ try{analyser.disconnect();}catch(_){} analyser=null; }
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  if(audioCtx){ audioCtx.suspend().catch(()=>{}); }
  setMic('off'); setStatus('Stopped',''); drawGauge(0); drawString(null,null);
  toggleBtn.textContent='Start'; toggleBtn.dataset.state='off';
  avgWindowFreq=null; stableCounter=0;
}
toggleBtn.addEventListener('click',()=> (toggleBtn.dataset.state==='on' ? stopTuner() : startTuner()) );
document.addEventListener('visibilitychange',()=>{ if(!audioCtx) return; if(document.hidden) audioCtx.suspend().catch(()=>{}); else if(toggleBtn.dataset.state==='on') audioCtx.resume().catch(()=>{}); });
window.addEventListener('focus',()=>{ if(audioCtx && audioCtx.state!=='running' && toggleBtn.dataset.state==='on'){ audioCtx.resume().catch(()=>{});} });

/* ===== Tuning + instrument ===== */
const tuningSel=document.getElementById('tuning');
function parseTuning(v){
  if(!v) return null;
  return v.split(',').map(p=>{
    const name=p[0].toUpperCase()+(p[1]==='#'?'#':'');
    const oct=parseInt(p.replace(/[^0-9]/g,''),10);
    const midi=(oct+1)*12+['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(name);
    return {name,octave:oct,midi};
  });
}
let stringLabels=[]; // names from tuning
function refreshTuning(){
  const opt=tuningSel.selectedOptions[0];
  const t=parseTuning(opt.value);
  stringLabels = t ? t.map(x=>x.name) : [];
  targetSet = t;
  noteLabel.textContent = t ? ('Target: '+stringLabels.join(' • ')) : 'Target: Chromatic';
  avgWindowFreq=null; stableCounter=0; drawString(null,null);
}
tuningSel.addEventListener('change',refreshTuning);

/* ===== Metronome ===== */
const beatsWrap=document.getElementById('beats'), tsSel=document.getElementById('timesig'), bpmInput=document.getElementById('bpm'), metroToggle=document.getElementById('metroToggle');
let metroTimer=null, metroCtxObj=null, metroGain=null, beatIndex=0, beatTotal=4;
function renderBeats(){beatsWrap.innerHTML=''; const top=parseInt(tsSel.value.split('/')[0],10); beatTotal=top; for(let i=0;i<beatTotal;i++){const b=document.createElement('div'); b.className='beat'; if(['6/8','9/8','12/8'].includes(tsSel.value)&&(i%3===0)) b.classList.add('group'); if(['2/4','3/4','4/4'].includes(tsSel.value)&&i===0) b.classList.add('group'); beatsWrap.appendChild(b);}}
function metroClick(){
  const t=metroCtxObj.currentTime,osc=metroCtxObj.createOscillator(),g=metroCtxObj.createGain();
  const accent=(beatIndex===0 || (['6/8','9/8','12/8'].includes(tsSel.value) && beatIndex%3===0));
  osc.type='square'; osc.frequency.value=accent?1450:1000;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(accent?0.8:0.55,t+0.001); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  osc.connect(g).connect(metroGain).connect(metroCtxObj.destination); osc.start(t); osc.stop(t+0.08);
  const nodes=[...beatsWrap.children]; nodes.forEach(n=>n.classList.remove('active')); if(nodes[beatIndex]) nodes[beatIndex].classList.add('active'); beatIndex=(beatIndex+1)%beatTotal;
}
function startMetronome(){
  stopMetronome();
  metroCtxObj=new (window.AudioContext||window.webkitAudioContext)(); metroGain=metroCtxObj.createGain(); metroGain.gain.value=0.9;
  const bpm=Math.min(300,Math.max(30,parseInt(bpmInput.value||'100',10)));
  metroTimer=setInterval(metroClick, 60000/bpm); beatIndex=0;
  metroToggle.textContent='Stop'; metroToggle.dataset.state='on';
}
function stopMetronome(){
  if(metroTimer) clearInterval(metroTimer), metroTimer=null;
  if(metroCtxObj) metroCtxObj.close(), metroCtxObj=null;
  [...beatsWrap.children].forEach(n=>n.classList.remove('active'));
  metroToggle.textContent='Start'; metroToggle.dataset.state='off';
}
metroToggle.addEventListener('click',()=> (metroToggle.dataset.state==='on'? stopMetronome():startMetronome()));
tsSel.addEventListener('change',renderBeats);

/* ===== Init ===== */
function sizeAll(){ sizeBars(); sizeGauge(); sizeString(); }
window.addEventListener('DOMContentLoaded',()=>{ sizeAll(); refreshTuning(); renderBeats(); });
window.addEventListener('resize', sizeAll, {passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && metroTimer){ stopMetronome(); }});
</script>
</body>
